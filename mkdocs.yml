      - ROI Tracking: roi-tracking.md
  - Experiments and Analyses:
      - Passive: passive.md
      - 2AFC: twoafc.md
      - Closed Loop: closed-loop.md
      - Joystick: joystick.md
      - EBC: ebc.md
      - DLC Local Setup: DLC_Local_Setup.md
      - DLC Pipeline: DLC_Pipeline.md
